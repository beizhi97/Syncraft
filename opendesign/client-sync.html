<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFSC · 同步</title><link rel="stylesheet" href="prototype.css"></head><body><div class="app-shell">
<aside class="sidebar" data-od-id="client-sidebar"><div class="brand"><span class="brand-mark">SF</span><strong>SFSC</strong></div><div class="nav-label">工作区</div><a class="nav-item active" href="client-sync.html"><span class="nav-dot"></span>同步</a><a class="nav-item" href="client-history.html"><span class="nav-dot"></span>历史</a><a class="nav-item" href="client-settings.html"><span class="nav-dot"></span>设置</a><div class="sidebar-foot"><div class="status success">后台运行正常</div><div style="margin-top:7px">关闭窗口后进入托盘</div></div></aside>
<main class="main" data-od-id="client-sync-main"><header class="topbar"><span class="crumb">同步</span><div class="top-actions"><span id="profileStatus" class="status success">Profile 已连接</span><span id="syncStatus" class="status">空闲</span></div></header><div class="content">
<div class="page-head"><div><h1 data-od-id="client-sync-title">同步任务</h1><p>选择本地文件夹和同步方式，预览目标后开始。</p></div><button id="runSyncBtn" class="btn primary" data-od-id="run-sync-button">预览并开始</button></div>
<div class="split"><section class="panel" data-od-id="sync-task-panel"><div class="panel-head"><h2>任务设置</h2><span class="badge">手动任务</span></div><div class="panel-body stack"><div class="field"><label for="localPath">本地文件夹</label><div class="input-row"><input id="localPath" class="input" value="C:\Users\示例用户\Documents\工作资料" title="示例路径"><button id="chooseFolderBtn" class="btn">浏览…</button></div></div><div class="grid-2"><div class="field"><label for="direction">同步方向</label><select id="direction"><option value="upload">上传（本地 → 远端）</option><option value="download">下载（远端 → 本地）</option><option value="bidirectional">双向同步</option></select></div><div class="field"><label for="serverSpace">空间</label><select id="serverSpace"><option value="device">设备空间</option><option value="shared">共享空间</option></select></div></div><div class="grid-2"><div class="field"><label for="remoteFolder">远端子目录（可选）</label><input id="remoteFolder" class="input" placeholder="使用 T-key 下发目录"></div><div class="field"><label for="scheduleMode">计划</label><select id="scheduleMode"><option value="manual">手动</option><option value="interval">按间隔</option><option value="daily">每天定时</option><option value="startup">启动时</option></select></div></div>
<div class="summary-list"><div class="summary-row"><span class="k">远端目标</span><span class="mono truncate" title="sfsc-remote:device/example-device/">sfsc-remote:device/example-device/</span></div><div class="summary-row"><span class="k">执行方式</span><span>复制新增和修改文件，不删除目标端文件</span></div><div class="summary-row"><span class="k">兼容性</span><span class="status success">协议兼容</span></div></div>
<details><summary style="cursor:pointer;font-weight:550">高级参数</summary><div class="grid-2" style="margin-top:12px"><div class="field"><label for="transfers">并行文件</label><input id="transfers" class="input" type="number" value="4"></div><div class="field"><label for="streams">单文件线程</label><input id="streams" class="input" type="number" value="8"></div></div><div style="margin-top:12px"><button class="btn small" data-open-modal="dangerModal">镜像同步设置…</button></div></details><div class="btn-row"><button id="saveJobBtn" class="btn" data-toast="任务已保存">保存任务</button><button class="btn" data-toast="预览已更新">只预览</button><span class="spacer"></span><button id="stopSyncBtn" class="btn" disabled>停止同步</button></div></div></section>
<aside class="stack"><section class="panel" data-od-id="sync-progress-panel"><div class="panel-head"><h2>当前状态</h2><span id="progressValue" class="mono">0%</span></div><div class="panel-body stack"><div><div class="progress"><span id="progressFill"></span></div><div id="syncStage" style="margin-top:9px;color:var(--muted)">等待开始</div></div><div class="metric-row"><div class="metric"><span class="label">速度</span><span class="value">—</span></div><div class="metric"><span class="label">已传输</span><span class="value">—</span></div><div class="metric"><span class="label">冲突</span><span class="value">0</span></div></div><div class="summary-list"><div class="summary-row"><span class="k">当前文件</span><span class="truncate">—</span></div><div class="summary-row"><span class="k">最近同步</span><span>今天 09:42 · 成功</span></div><div class="summary-row"><span class="k">下次运行</span><span>手动</span></div></div></div></section><section class="notice success" data-od-id="client-ready-notice"><strong>可以开始同步</strong><span>组件、隧道、心跳和协议检查均正常。</span></section></aside></div></div></main></div>
<div id="dangerModal" class="modal"><form class="dialog"><div class="dialog-head"><h2>镜像同步设置</h2></div><div class="dialog-body stack"><div class="notice danger"><strong>会删除目标端多余文件</strong><span>双向同步不可启用此选项。保存或运行时仍会要求再次确认。</span></div><label><input type="checkbox" id="destructiveSync"> 启用镜像同步</label><div class="field"><label for="confirmTextInput">请输入 DELETE 以确认</label><input id="confirmTextInput" class="input" autocomplete="off"></div></div><div class="dialog-foot"><button type="button" class="btn" data-close-modal>取消</button><button id="confirmSubmitBtn" class="btn danger" disabled>确认启用</button></div></form></div><script src="prototype.js"></script></body></html>
