<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFSC 管理控制台 · 登录</title><link rel="stylesheet" href="prototype.css"></head><body style="min-width:0"><main style="min-height:100vh;display:grid;place-items:center;padding:24px" data-od-id="server-login"><form id="loginForm" class="panel" style="width:min(420px,100%);padding:24px"><div class="brand" style="padding:0;margin:0 0 24px"><span class="brand-mark" style="background:var(--sidebar);color:#fff">SF</span><strong>SFSC 管理控制台</strong></div><div class="stack"><div><h1 style="font-size:22px;letter-spacing:-.015em;margin:0 0 5px" data-od-id="server-login-title">管理登录</h1><p style="margin:0;color:var(--muted)">输入管理 Token 以访问服务状态和设备管理。</p></div><div class="field"><label for="adminTokenInput">管理 Token</label><input id="adminTokenInput" class="input" type="password" autocomplete="current-password" placeholder="输入管理 Token"></div><div id="authMessage" style="min-height:20px;font-size:12px"></div><button class="btn primary" type="submit" data-od-id="server-login-button">登录</button></div></form></main><script src="prototype.js"></script></body></html>
