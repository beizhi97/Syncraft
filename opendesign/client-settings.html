<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFSC · 设置</title><link rel="stylesheet" href="prototype.css"></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">SF</span><strong>SFSC</strong></div><div class="nav-label">工作区</div><a class="nav-item" href="client-sync.html"><span class="nav-dot"></span>同步</a><a class="nav-item" href="client-history.html"><span class="nav-dot"></span>历史</a><a class="nav-item active" href="client-settings.html"><span class="nav-dot"></span>设置</a><div class="sidebar-foot"><div class="status success">后台运行正常</div></div></aside><main class="main"><header class="topbar"><span class="crumb">设置</span><div class="top-actions"><span class="status success">Profile 已连接</span></div></header><div class="content"><div class="page-head"><div><h1 data-od-id="settings-title">设置与诊断</h1><p>常用连接设置在前，组件、协议和日志收进诊断区域。</p></div></div><div class="split"><section class="panel"><div class="tabs"><a class="tab active">连接</a><a class="tab">同步默认值</a><a class="tab">诊断</a></div><div class="panel-body stack"><div class="field"><label for="claimCode">替换 T-key</label><input id="claimCode" class="input credential-input" type="text" placeholder="粘贴新的完整 T-key 或导入 URI" autocomplete="off" spellcheck="false"></div><div class="btn-row"><button id="saveProfileBtn" class="btn primary">导入并验证</button></div><div id="importMessage" class="notice"><strong>当前 Profile 正常</strong><span>已连接到示例服务端；敏感字段保存在本机密钥库中。</span></div><div class="summary-list"><div class="summary-row"><span class="k">客户端</span><span>示例设备</span></div><div class="summary-row"><span class="k">仓库</span><span>示例仓库</span></div><div class="summary-row"><span class="k">心跳</span><span class="status success">正常</span></div><div class="summary-row"><span class="k">协议</span><span class="status success">兼容</span></div></div></div></section><aside class="stack"><section class="panel"><div class="panel-head"><h2>运行组件</h2><button class="btn small" data-toast="组件已重新检测">重新检测</button></div><div class="panel-body summary-list"><div class="summary-row"><span class="k">sing-box</span><span class="status success">可用</span></div><div class="summary-row"><span class="k">rclone</span><span class="status success">可用</span></div><div class="summary-row"><span class="k">隧道</span><span class="status success">运行中</span></div><div class="summary-row"><span class="k">本地状态</span><span class="status success">完整</span></div></div></section><section class="panel"><div class="panel-head"><h2>支持与诊断</h2></div><div class="panel-body stack"><div class="notice"><strong>导出内容会自动脱敏</strong><span>不包含完整 T-key、密钥、VLESS URI、本机用户名或绝对路径。</span></div><div class="btn-row"><button class="btn" data-toast="已生成支持摘要">复制支持摘要</button><button class="btn" data-toast="已导出脱敏诊断包">导出诊断包</button></div><div class="btn-row"><button class="btn" data-toast="已打开日志查看器">查看近期日志</button><button class="btn" data-toast="已生成脱敏命令预览">命令预览</button></div></div></section></aside></div></div></main></div><script src="prototype.js"></script></body></html>
