<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Syncraft 管理控制台 · SyncKey</title>
  <link rel="stylesheet" href="prototype.css">
</head>
<body class="server-console">
  <div class="app-shell">
    <aside class="sidebar" aria-label="管理导航">
      <div class="brand"><span class="brand-mark" aria-hidden="true">SF</span><strong>Syncraft 管理</strong></div>
      <div class="nav-label">运行</div>
      <a class="nav-item" href="server-overview.html"><span class="nav-dot"></span>概览</a>
      <a class="nav-item active" href="server-tkey.html" aria-current="page"><span class="nav-dot"></span>SyncKey</a>
      <a class="nav-item" href="server-devices.html"><span class="nav-dot"></span>设备</a>
      <div class="nav-label">配置</div>
      <a class="nav-item" href="server-infrastructure.html"><span class="nav-dot"></span>基础设置</a>
      <div class="sidebar-foot"><span id="claimServiceStatus" class="status">管理状态未加载</span></div>
    </aside>

    <main class="main">
      <header class="topbar"><span class="crumb">SyncKey</span><span class="status success">已登录</span></header>
      <div class="content server-content">
        <div class="page-head compact-head"><div><h1 data-od-id="tkey-title">签发 SyncKey</h1></div><button id="refreshClaimStateBtn" class="btn" type="button">刷新可选项</button></div>

        <div class="issuance-layout">
          <form class="issuance-form" data-od-id="tkey-form-panel">
            <fieldset class="form-section">
              <legend><span>1</span>同步空间</legend>
              <div class="field"><label for="claimBucket">同步 ID</label><select id="claimBucket" disabled><option value="">正在加载同步空间</option></select></div>
            </fieldset>
            <fieldset class="form-section">
              <legend><span>2</span>设备与角色</legend>
              <div class="grid-2">
                <div class="field"><label for="deviceName">设备</label><select id="deviceName" disabled><option value="">正在加载已启用设备</option></select></div>
                <div class="field"><label for="claimRole">角色</label><select id="claimRole"><option value="owner">所有者</option><option value="writer" selected>可写</option><option value="reader">只读</option></select></div>
              </div>
            </fieldset>
            <fieldset class="form-section">
              <legend><span>3</span>有效期</legend>
              <div class="field field-narrow"><label for="claimExpiry">一次性兑换有效期</label><select id="claimExpiry"><option>1 小时</option><option selected>8 小时</option><option>24 小时</option></select></div>
            </fieldset>
            <div class="form-actions"><button id="createClaimBtn" class="btn primary" data-od-id="create-tkey-button" type="button" disabled>生成 SyncKey</button></div>
          </form>

          <aside id="claimResult" class="result-surface hidden" data-od-id="tkey-result-panel" aria-live="polite">
            <div class="section-head"><h2>生成结果</h2><span class="badge warning">仅显示一次</span></div>
            <div class="result-body">
              <dl class="result-list">
                <div><dt>同步 ID</dt><dd id="claimResultSyncId">—</dd></div>
                <div><dt>设备</dt><dd id="claimResultDevice">—</dd></div>
                <div><dt>角色</dt><dd id="claimResultRole">—</dd></div>
                <div><dt>有效期</dt><dd>等待签发结果</dd></div>
              </dl>
              <div class="field"><label for="claimMasked">SyncKey 导入码</label><div class="input-row"><div id="claimMasked" class="input secret" role="textbox" aria-readonly="true">••••••••••••</div><button class="btn" type="button" data-secret-toggle="claimMasked">显示</button></div></div>
              <div class="btn-row"><button class="btn primary" type="button" data-toast="导入码已复制">复制导入码</button><button class="btn" type="button" data-toast="导入链接已复制">复制导入链接</button></div>
              <button class="btn danger-link" type="button" data-open-modal="redeemModal">测试兑换</button>
            </div>
          </aside>
        </div>
      </div>
    </main>
  </div>

  <div id="redeemModal" class="modal" aria-hidden="true">
    <div class="dialog" aria-labelledby="redeemTitle">
      <div class="dialog-head"><h2 id="redeemTitle">确认测试兑换</h2></div>
      <div class="dialog-body"><p>测试后该 SyncKey 立即失效。</p></div>
      <div class="dialog-foot"><button class="btn" type="button" data-close-modal>取消</button><button class="btn danger" type="button" data-close-modal data-toast="测试兑换请求已提交">确认兑换</button></div>
    </div>
  </div>
  <script src="prototype.js"></script>
</body>
</html>
