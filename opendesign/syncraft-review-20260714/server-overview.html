<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Syncraft 管理控制台 · 概览</title>
  <link rel="stylesheet" href="prototype.css">
</head>
<body class="server-console server-overview-page">
  <div class="app-shell">
    <aside class="sidebar" data-od-id="server-sidebar" aria-label="管理导航">
      <div class="brand"><span class="brand-mark" aria-hidden="true">SF</span><strong>Syncraft 管理</strong></div>
      <div class="nav-label">运行</div>
      <a class="nav-item active" href="server-overview.html" aria-current="page"><span class="nav-dot"></span>概览</a>
      <a class="nav-item" href="server-tkey.html"><span class="nav-dot"></span>SyncKey</a>
      <a class="nav-item" href="server-devices.html"><span class="nav-dot"></span>设备</a>
      <div class="nav-label">配置</div>
      <a class="nav-item" href="server-infrastructure.html"><span class="nav-dot"></span>基础设置</a>
      <div class="sidebar-foot"><span class="status warning">服务状态未完整加载</span></div>
    </aside>

    <main class="main" data-od-id="server-overview-main">
      <header class="topbar" data-od-id="server-topbar">
        <span class="crumb">运行概览</span>
        <div class="top-actions"><span class="status success">已登录</span><a class="btn small" href="server-login.html">退出</a></div>
      </header>

      <div class="content server-content" id="overviewContent" aria-busy="false">
        <div class="page-head compact-head">
          <div><h1 data-od-id="server-overview-title">运行概览</h1></div>
          <div class="refresh-control">
            <span id="refreshState" class="refresh-state" role="status" aria-live="polite"></span>
            <button id="refreshBtn" class="btn" type="button" data-od-id="refresh-server-status">刷新</button>
          </div>
        </div>

        <section class="attention-board" data-od-id="server-attention-panel" aria-labelledby="attentionTitle">
          <div class="section-head"><h2 id="attentionTitle">需要处理</h2><span class="badge warning">2 项状态未确认</span></div>
          <div class="attention-list">
            <article class="attention-row warning">
              <span class="severity">警告</span>
              <div><strong>设备兼容性摘要不可用</strong><p>无法确认配置下发与同步是否会被阻止。</p></div>
              <a class="btn small" href="server-devices.html">查看设备</a>
            </article>
            <article class="attention-row danger">
              <span class="severity">失败</span>
              <div><strong>组件版本检查部分失败</strong><p>MinIO 与 MinIO mc 当前状态未知。</p></div>
              <a class="btn small" href="server-infrastructure.html#settings-versions">检查组件</a>
            </article>
          </div>
        </section>

        <section class="runtime-strip" data-od-id="server-metrics" aria-label="关键运行状态">
          <div><span>隧道</span><strong class="status">等待状态</strong></div>
          <div><span>设备</span><strong class="mono">—</strong></div>
          <div><span>同步中</span><strong class="mono">—</strong></div>
          <div><span>存储</span><strong class="status">等待状态</strong></div>
        </section>

        <section class="table-section" data-od-id="server-recent-devices">
          <div class="section-head"><h2>近期设备</h2><a class="btn small" href="server-devices.html">查看全部</a></div>
          <div class="table-wrap" tabindex="0" aria-label="近期设备表格，可横向滚动">
            <table>
              <thead><tr><th>设备</th><th>在线</th><th>末次心跳</th><th>兼容性</th><th>最近同步</th><th></th></tr></thead>
              <tbody id="overviewDeviceList"><tr><td colspan="6" class="empty-cell">设备状态尚未加载。刷新后重试。</td></tr></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="prototype.js"></script>
  <script>
    (function () {
      var content = document.getElementById('overviewContent');
      var button = document.getElementById('refreshBtn');
      var state = document.getElementById('refreshState');
      button.addEventListener('click', function () {
        if (button.disabled) return;
        button.disabled = true;
        button.textContent = '刷新中';
        content.setAttribute('aria-busy', 'true');
        state.textContent = '正在读取状态';
        window.setTimeout(function () {
          button.disabled = false;
          button.textContent = '重试';
          content.setAttribute('aria-busy', 'false');
          state.textContent = '部分状态读取失败';
          state.classList.add('error-text');
        }, 520);
      });
    })();
  </script>
</body>
</html>
