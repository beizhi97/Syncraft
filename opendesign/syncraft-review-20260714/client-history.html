<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Syncraft · 同步历史</title><link rel="stylesheet" href="prototype.css"></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">SF</span><strong>Syncraft</strong></div><div class="nav-label">工作区</div><a class="nav-item" href="client-sync.html"><span class="nav-dot"></span>同步</a><a class="nav-item active" href="client-history.html"><span class="nav-dot"></span>历史</a><a class="nav-item" href="client-settings.html"><span class="nav-dot"></span>设置</a><div class="sidebar-foot"><div class="status">后台运行状态等待更新</div><div style="margin-top:7px">关闭窗口后进入系统托盘</div></div></aside><main class="main"><header class="topbar"><span class="crumb">同步历史</span><div class="top-actions"><span id="historyLoadState" class="status">等待历史接口</span></div></header><div class="content"><div class="page-head"><div><h1 data-od-id="history-title">最近同步</h1><p>从本机历史接口加载运行、冲突和失败处理建议。</p></div><button class="btn" data-refresh-history>刷新</button></div><section class="panel" data-od-id="history-table-panel"><div class="toolbar"><select id="historyStatusFilter" style="width:150px"><option value="">全部状态</option><option value="success">成功</option><option value="error">失败</option><option value="stopped">已停止</option><option value="conflict">有冲突</option></select><input id="historySearch" class="input" placeholder="搜索同步 ID 或本地内容"><span class="spacer"></span><span class="status">等待真实历史数据</span></div><table><thead><tr><th style="width:18%">状态</th><th style="width:24%">同步 ID</th><th style="width:19%">触发时间</th><th style="width:15%">耗时</th><th>结果</th><th style="width:80px"></th></tr></thead><tbody id="syncHistoryList"><tr><td colspan="6" class="empty-cell">暂无同步历史。点击“刷新”从本机历史接口重新加载。</td></tr></tbody></table></section></div></main></div><script src="prototype.js"></script></body></html>
