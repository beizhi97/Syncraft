<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFSC · 同步历史</title><link rel="stylesheet" href="prototype.css"></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">SF</span><strong>SFSC</strong></div><div class="nav-label">工作区</div><a class="nav-item" href="client-sync.html"><span class="nav-dot"></span>同步</a><a class="nav-item active" href="client-history.html"><span class="nav-dot"></span>历史</a><a class="nav-item" href="client-settings.html"><span class="nav-dot"></span>设置</a><div class="sidebar-foot"><div class="status success">后台运行正常</div></div></aside><main class="main"><header class="topbar"><span class="crumb">同步历史</span><div class="top-actions"><span class="status success">后台运行正常</span></div></header><div class="content"><div class="page-head"><div><h1 data-od-id="history-title">最近同步</h1><p>查看最近 20 次运行、冲突和失败处理建议。</p></div><button class="btn" data-toast="历史已刷新">刷新</button></div><section class="panel" data-od-id="history-table-panel"><div class="toolbar"><select id="historyStatusFilter" style="width:150px"><option value="">全部状态</option><option value="success">成功</option><option value="error">失败</option><option value="stopped">已停止</option><option value="conflict">有冲突</option><option value="unknown">未知</option></select><input class="input" placeholder="搜索任务或文件夹"><span class="spacer"></span><span class="status success">3 次成功</span></div><table><thead><tr><th style="width:18%">状态</th><th style="width:24%">任务</th><th style="width:19%">触发时间</th><th style="width:15%">耗时</th><th>结果</th><th style="width:80px"></th></tr></thead><tbody>
<tr data-state="success"><td><span class="status success">成功</span></td><td>工作资料</td><td class="mono">今天 09:42</td><td class="mono">01:18</td><td>更新 12 个文件</td><td class="table-actions"><button class="btn small" data-toast="已打开运行详情">详情</button></td></tr>
<tr data-state="conflict"><td><span class="status warning">有冲突</span></td><td>共享文档</td><td class="mono">昨天 18:10</td><td class="mono">03:47</td><td>2 个文件需确认</td><td class="table-actions"><button class="btn small" data-toast="已打开冲突详情">处理</button></td></tr>
<tr data-state="error"><td><span class="status danger">失败</span></td><td>工作资料</td><td class="mono">昨天 08:30</td><td class="mono">00:12</td><td><span class="mono">heartbeat_failed</span></td><td class="table-actions"><button class="btn small" data-open-modal="errorModal">查看</button></td></tr>
<tr data-state="stopped"><td><span class="status">已停止</span></td><td>照片归档</td><td class="mono">周一 21:06</td><td class="mono">06:22</td><td>用户主动停止</td><td class="table-actions"><button class="btn small" data-toast="已打开运行详情">详情</button></td></tr></tbody></table></section></div></main></div>
<div id="errorModal" class="modal"><div class="dialog"><div class="dialog-head"><h2>服务端心跳失败</h2></div><div class="dialog-body stack"><div class="notice danger"><strong>本次同步没有开始</strong><span>客户端无法确认服务端状态，现有文件未被修改。</span></div><div class="summary-list"><div class="summary-row"><span class="k">错误码</span><span class="mono">heartbeat_failed</span></div><div class="summary-row"><span class="k">下一步</span><span>检查网络与服务端地址，然后重新检测连接。</span></div></div></div><div class="dialog-foot"><button class="btn" data-close-modal>关闭</button><a class="btn primary" href="client-settings.html">检查连接</a></div></div></div><script src="prototype.js"></script></body></html>
