<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFSC · 首次连接</title><link rel="stylesheet" href="prototype.css"></head><body>
<main class="onboarding" data-od-id="client-onboarding"><aside class="onboarding-side" data-od-id="onboarding-side"><div class="brand"><span class="brand-mark">SF</span><strong>SFSC</strong></div><div style="margin-top:64px"><div class="status success" style="color:#fff">组件已就绪</div><h1 style="font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:18px 0 10px">连接这台电脑</h1><p style="color:rgba(255,255,255,.65);max-width:34ch">导入管理员提供的一次性 T-key，然后选择第一个同步文件夹。</p></div><div class="sidebar-foot">关闭窗口后，SFSC 将留在系统托盘继续运行。</div></aside>
<section class="onboarding-main" data-od-id="onboarding-form"><div class="onboarding-card"><div class="stepper"><div class="step done">组件检查</div><div class="step active">导入 T-key</div><div class="step">选择文件夹</div><div class="step">开始同步</div></div>
<div class="panel"><div class="panel-head"><h2 data-od-id="onboarding-title">导入 T-key</h2></div><div class="panel-body stack"><div class="notice"><strong>一次性凭据</strong><span>T-key 成功兑换后不能再次使用。请勿把完整内容发送给其他人。</span></div><div class="field"><label for="claimCode">完整 T-key 或导入 URI</label><input id="claimCode" class="input credential-input" type="text" placeholder="粘贴 SFSC1-… 或 sfsc://import/v1#…" autocomplete="off" spellcheck="false"></div><div id="importMessage" class="notice"><strong>等待导入</strong><span>完成导入后会自动检查服务端连接、组件和协议兼容性。</span></div><div class="btn-row"><button id="saveProfileBtn" class="btn primary" data-od-id="import-tkey-button">导入并检查连接</button></div></div></div></div></section></main><script src="prototype.js"></script></body></html>
