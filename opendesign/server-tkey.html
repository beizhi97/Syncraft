<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFSC 管理控制台 · T-key</title><link rel="stylesheet" href="prototype.css"></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">SF</span><strong>SFSC 管理</strong></div><div class="nav-label">运行</div><a class="nav-item" href="server-overview.html"><span class="nav-dot"></span>概览</a><a class="nav-item active" href="server-tkey.html"><span class="nav-dot"></span>T-key</a><a class="nav-item" href="server-devices.html"><span class="nav-dot"></span>设备</a><div class="nav-label">配置</div><a class="nav-item" href="server-infrastructure.html"><span class="nav-dot"></span>基础设置</a><div class="sidebar-foot"><div class="status success">服务端在线</div></div></aside><main class="main"><header class="topbar"><span class="crumb">T-key</span><div class="top-actions"><span class="status success">签发服务正常</span></div></header><div class="content"><div class="page-head"><div><h1 data-od-id="tkey-title">生成一次性 T-key</h1><p>为一个设备和一个同步仓库生成凭据；成功兑换后立即失效。</p></div></div><div class="split"><section class="panel" data-od-id="tkey-form-panel"><div class="panel-head"><h2>签发参数</h2><span class="status success">签发条件正常</span></div><div class="panel-body stack"><div class="field"><label for="deviceName">设备名</label><input id="deviceName" class="input" value="新设备" maxlength="64"></div><div class="grid-2"><div class="field"><label for="claimBucket">同步仓库</label><select id="claimBucket"><option>主仓库</option><option>共享仓库</option></select></div><div class="field"><label for="claimExpiry">有效期</label><select id="claimExpiry"><option>1 小时</option><option selected>8 小时</option><option>24 小时</option></select></div></div><div class="grid-3"><div class="field"><label>并行文件</label><input class="input" type="number" value="4"></div><div class="field"><label>单文件线程</label><input class="input" type="number" value="8"></div><div class="field"><label>计划模式</label><select><option>手动</option><option>每 30 分钟</option></select></div></div><button id="createClaimBtn" class="btn primary" data-od-id="create-tkey-button">生成 T-key</button></div></section><aside id="claimResult" class="panel hidden" data-od-id="tkey-result-panel"><div class="panel-head"><h2>T-key 已生成</h2><span class="badge warning">仅显示一次</span></div><div class="panel-body stack"><div class="notice warning"><strong>请安全交给目标用户</strong><span>不要通过公开频道发送。测试兑换会消耗该 T-key。</span></div><div class="field"><label>完整 T-key</label><div class="input-row"><div id="claimMasked" class="input secret">SFSC1-••••-••••-••••</div><button class="btn" data-secret-toggle="claimMasked">显示</button></div></div><div class="btn-row"><button class="btn" data-toast="已复制完整 T-key 示例">复制完整 T-key</button><button class="btn" data-toast="已复制导入 URI 示例">复制导入 URI</button></div><button class="btn" data-open-modal="redeemModal">测试兑换…</button></div></aside></div></div></main></div><div id="redeemModal" class="modal"><div class="dialog"><div class="dialog-head"><h2>测试兑换会消耗 T-key</h2></div><div class="dialog-body"><div class="notice warning"><strong>测试后不能交给客户端使用</strong><span>仅在验证签发链路时执行；正常交付请取消。</span></div></div><div class="dialog-foot"><button class="btn" data-close-modal>取消</button><button class="btn danger" data-close-modal data-toast="测试兑换完成；该示例 T-key 已失效">确认测试兑换</button></div></div></div><script src="prototype.js"></script></body></html>
